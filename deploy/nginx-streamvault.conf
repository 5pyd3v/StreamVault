# nginx reverse-proxy config for StreamVault -- equivalent of
# deploy/apache-streamvault.conf, for hosts that have nginx instead of Apache.
#
# Node (via `deploy/streamvault.service`) already serves the built frontend,
# the REST API, /uploads, and Socket.IO all on ONE port (default 5000) -- so
# nginx's only job here is to forward the whole domain to that one port.
#
# Install:
#   sudo cp deploy/nginx-streamvault.conf /etc/nginx/sites-available/streamvault
#   sudo ln -s /etc/nginx/sites-available/streamvault /etc/nginx/sites-enabled/
#   sudo nginx -t   # check for syntax errors before reloading
#   sudo systemctl reload nginx
#
# Then run `sudo certbot --nginx -d yourdomain.com` to add HTTPS.

server {
    listen 80;
    server_name yourdomain.com;

    # StreamVault enforces its own upload limits (CHUNK_SIZE_MB, MAX_FILE_SIZE_GB
    # in server/.env) -- nginx's default (1m) would otherwise reject a chunk
    # before it ever reaches Node. 0 = unlimited.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Required for Socket.IO's WebSocket upgrade -- without these two
        # headers everything else appears to work, but live progress/updates
        # never arrive.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /var/log/nginx/streamvault-access.log;
    error_log /var/log/nginx/streamvault-error.log;
}

# ── Not proxied: live streaming RTMP ingest (port 1935) ───────────────────────
# OBS connects directly to Node's RTMP listener, not through nginx/HTTP at
# all. Make sure port 1935 is open in your firewall/security group directly
# (e.g. `sudo ufw allow 1935/tcp`), and set PUBLIC_RTMP_HOST in server/.env to
# this VPS's public IP or domain -- NOT localhost -- so streamers' OBS
# "Server" field actually resolves to something reachable from outside.
