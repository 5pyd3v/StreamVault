# Apache reverse-proxy config for StreamVault.
#
# Node (via `deploy/streamvault.service`) already serves the built frontend,
# the REST API, /uploads, and Socket.IO all on ONE port (default 5000) -- so
# Apache's only job here is to forward the whole domain to that one port.
# There is deliberately nothing else for Apache to route: no separate static
# file serving, no path-splitting between /api and everything else. That's
# what makes this config hard to get subtly wrong.
#
# Required modules (enable once):
#   sudo a2enmod proxy proxy_http proxy_wstunnel rewrite
#   sudo systemctl restart apache2
#
# Install this file:
#   sudo cp deploy/apache-streamvault.conf /etc/apache2/sites-available/streamvault.conf
#   sudo a2ensite streamvault
#   sudo apache2ctl configtest   # check for syntax errors before reloading
#   sudo systemctl reload apache2
#
# Then run `sudo certbot --apache -d yourdomain.com` to add HTTPS -- certbot
# will add its own :443 VirtualHost block and redirect here automatically.
# Do that AFTER confirming the plain :80 config below works.

<VirtualHost *:80>
    ServerName yourdomain.com
    # ServerAlias www.yourdomain.com

    ProxyPreserveHost On
    ProxyRequests Off

    # Socket.IO needs a real WebSocket upgrade, not just a regular HTTP proxy --
    # this is the part that's easiest to silently get wrong (everything else
    # appears to work, but live progress/updates never arrive). Requires
    # mod_proxy_wstunnel + mod_rewrite (enabled above).
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:5000/$1 [P,L]

    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # StreamVault enforces its own upload limits (CHUNK_SIZE_MB, MAX_FILE_SIZE_GB
    # in server/.env) -- don't let Apache's default body-size limit reject a
    # chunk before it ever reaches Node. 0 = unlimited.
    LimitRequestBody 0

    # If mod_security is enabled on this host, its default ruleset commonly
    # blocks large multipart/form-data uploads (this is the exact failure this
    # project hit: uploads silently failing with nothing reaching Node). Check
    # /var/log/apache2/modsec_audit.log (or your distro's equivalent) for a
    # rule ID tied to the failed request, then either disable mod_security for
    # just the upload path or exclude that rule:
    #
    # <Location /api/upload/chunk>
    #     SecRuleRemoveById <rule-id-from-audit-log>
    # </Location>

    ProxyTimeout 300

    ErrorLog ${APACHE_LOG_DIR}/streamvault-error.log
    CustomLog ${APACHE_LOG_DIR}/streamvault-access.log combined
</VirtualHost>

# ── Not proxied: live streaming RTMP ingest (port 1935) ───────────────────────
# OBS connects directly to Node's RTMP listener, not through Apache/HTTP at
# all. Make sure port 1935 is open in your firewall/security group directly
# (e.g. `sudo ufw allow 1935/tcp`), and set PUBLIC_RTMP_HOST in server/.env to
# this VPS's public IP or domain -- NOT localhost -- so streamers' OBS
# "Server" field actually resolves to something reachable from outside.
